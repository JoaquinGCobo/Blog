<header class="site-header">
  <div class="shell header-inner">
    <a class="brand" href="{{ "/" | relURL }}">
      <span class="brand-mark">H</span>
      <span>
        <strong>{{ site.Title }}</strong>
      </span>
    </a>

    <nav class="site-nav" aria-label="Principal">
      <a href="{{ "/" | relURL }}">Inicio</a>
      <a href="{{ "/podcast/" | relURL }}">Podcast</a>
      <a href="{{ "/categories/" | relURL }}">Categorías</a>
      <a href="{{ "/categories/latín/" | relURL }}">Curso de Latín</a>
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Activar modo oscuro" aria-pressed="false" title="Cambiar tema">
        <span class="theme-toggle-icon" aria-hidden="true" data-theme-icon>
          <svg viewBox="0 0 24 24" focusable="false">
            <path d="M21 12.79A9 9 0 1 1 11.21 3c-.02.27-.03.54-.03.81A7.99 7.99 0 0 0 19.19 11c.61 0 1.21-.07 1.81-.21Z" fill="currentColor"></path>
          </svg>
        </span>
      </button>
    </nav>
  </div>
</header>
